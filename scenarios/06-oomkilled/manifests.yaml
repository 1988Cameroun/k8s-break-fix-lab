apiVersion: v1
kind: Namespace
metadata:
  name: lab-06
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: lab-06
  labels:
    app: image-resizer
spec:
  replicas: 1
  # A pod must stay up for 15s before it counts as Available,
  # so a container that dies right after starting fails the rollout.
  minReadySeconds: 15
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: resizer
          image: python:3.12-alpine
          env:
            - name: WORKING_SET_MB
              value: "150"
            - name: PYTHONUNBUFFERED
              value: "1"
          command:
            - python
            - -c
            - |
              import os, time
              mb = int(os.environ["WORKING_SET_MB"])
              print(f"image-resizer starting, allocating {mb} MB working buffer...")
              buf = bytearray(mb * 1024 * 1024)
              for i in range(0, len(buf), 4096):  # touch every page so it's really resident
                  buf[i] = 1
              print("buffer ready, processing images")
              while True:
                  print("resized batch of images")
                  time.sleep(30)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 100Mi
