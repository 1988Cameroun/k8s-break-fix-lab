apiVersion: v1
kind: Namespace
metadata:
  name: lab-11
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db
  namespace: lab-11
type: Opaque
stringData:
  db-password: "lab-only-not-a-real-password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: lab-11
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: lab-11
  labels:
    app: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: payments
          image: busybox:1.36
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: DB_PASSWORD
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: payments-config
                  key: LOG_LEVEL
          command:
            - /bin/sh
            - -c
            - |
              echo "payments starting (log level: $LOG_LEVEL)"
              echo "connected to database (password length: ${#DB_PASSWORD})"
              while true; do sleep 3600; done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
