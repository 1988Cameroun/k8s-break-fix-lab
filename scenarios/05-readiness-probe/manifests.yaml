apiVersion: v1
kind: Namespace
metadata:
  name: lab-05
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-nginx
  namespace: lab-05
data:
  default.conf: |
    server {
      listen 80;
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: lab-05
  labels:
    app: catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: catalog-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: lab-05
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: http
