apiVersion: v1
kind: Namespace
metadata:
  name: lab-09
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: lab-09
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploader
  namespace: lab-09
  labels:
    app: uploader
spec:
  replicas: 1
  # RWO volume: never run two pods against it during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uploader
  template:
    metadata:
      labels:
        app: uploader
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: uploader
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "$(date -Iseconds) uploader started" >> /data/uploads.log
              echo "storage ready:"; df -h /data
              while true; do sleep 3600; done
          readinessProbe:
            exec:
              command: ["test", "-s", "/data/uploads.log"]
            periodSeconds: 5
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
          volumeMounts:
            - name: uploads
              mountPath: /data
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
