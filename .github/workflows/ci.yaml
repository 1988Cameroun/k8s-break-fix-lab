name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck lab.sh lib/*.sh .devcontainer/*.sh scenarios/*/*.sh scenarios/*/.solution/*.sh

      - name: Validate manifests against the Kubernetes schema
        run: |
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/yannh/kubeconform:latest \
            -strict -summary scenarios/*/manifests.yaml

  # For every scenario, on a fresh kind cluster:
  #   1. deploy the broken state      -> verify must FAIL
  #   2. apply the reference fix      -> verify must PASS
  # This proves each scenario is really broken and really solvable.
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    name: scenario ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: k8s-lab
          config: kind/cluster.yaml

      - name: Deploy broken scenario
        run: ./lab.sh start ${{ matrix.scenario }}

      - name: Broken state must fail verification
        run: |
          if VERIFY_TIMEOUT=30 ./lab.sh check ${{ matrix.scenario }}; then
            echo "::error::Scenario ${{ matrix.scenario }} passed verification while broken"
            exit 1
          fi

      - name: Apply reference fix
        run: ./scenarios/${{ matrix.scenario }}-*/.solution/fix.sh

      - name: Fixed state must pass verification
        run: VERIFY_TIMEOUT=180 ./lab.sh check ${{ matrix.scenario }}

      - name: Debug info
        if: failure()
        run: |
          kubectl get all,pvc,networkpolicy -A -o wide | grep -E '^NAMESPACE|lab-' || true
          kubectl get events -A --sort-by=.lastTimestamp | grep lab- | tail -n 50 || true
