apiVersion: v1
kind: Namespace
metadata:
  name: lab-01
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: lab-01
data:
  config.yaml: |
    service: inventory-api
    port: 8080
    database:
      host: inventory-db
      pool_size: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: lab-01
  labels:
    app: inventory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              CONFIG=/etc/inventory/config.yaml
              if [ ! -f "$CONFIG" ]; then
                echo "$(date -Iseconds) FATAL: config file not found: $CONFIG" >&2
                exit 1
              fi
              echo "$(date -Iseconds) loaded config from $CONFIG:"
              cat "$CONFIG"
              while true; do echo "$(date -Iseconds) serving inventory requests"; sleep 30; done
          readinessProbe:
            exec:
              command: ["test", "-f", "/etc/inventory/config.yaml"]
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/inventory-config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: app-config
