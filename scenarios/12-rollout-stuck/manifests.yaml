apiVersion: v1
kind: Namespace
metadata:
  name: lab-12
---
# v1: the last known-good release. setup.sh then rolls out a broken v2 on top.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-12
  labels:
    app: web
  annotations:
    kubernetes.io/change-cause: "v1: initial release (nginx 1.27)"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-12
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
